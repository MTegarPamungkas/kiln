id: codegen
name: Codegen
version: 0.1.0
description: JSON model code generation with json_serializable and freezed, wired through build_runner.
category: codegen
tier: official
exclusive: true
provides:
  - codegen
dependencies:
  json_annotation: ^4.12.0
  freezed_annotation: ^3.1.0
dev_dependencies:
  build_runner: ^2.17.1
  json_serializable: ^6.15.2
  freezed: ^4.0.3
prompts:
  - name: generators
    type: multi
    label: Model generators to enable
    description: Choose which code generators to wire into the project.
    default:
      - json_serializable
      - freezed
    options:
      - json_serializable
      - freezed
    required: true
platforms:
  - android
  - ios
  - macos
  - web
  - windows
  - linux
compatibility:
  kiln: ">=0.1.0 <0.2.0"
  dart: ">=3.9.0"
