name: codegen
description: Code generation files for Kiln.
version: 0.1.0
environment:
  mason: ">=0.1.0 <0.2.0"
vars:
  id:
    type: string
    description: Extension id
    default: codegen
  app_name:
    type: string
    description: Application package name
    default: my_app
  generators:
    type: array
    description: Model generators to enable
    defaults:
      - json_serializable
      - freezed
