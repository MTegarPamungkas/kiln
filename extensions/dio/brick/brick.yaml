name: dio
description: HTTP client files for the Dio extension.
version: 0.2.0
environment:
  mason: ">=0.1.0 <0.2.0"
vars:
  id:
    type: string
    description: Extension id
    default: dio
  base_url:
    type: string
    description: API base URL
    default: https://api.example.com
  connect_timeout:
    type: number
    description: Connect timeout in seconds
    default: 15
  app_name:
    type: string
    description: Application package name
    default: my_app
