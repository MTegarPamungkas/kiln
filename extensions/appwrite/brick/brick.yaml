name: appwrite
description: Appwrite auth, database, and storage backends for Kiln.
version: 0.1.0
environment:
  mason: ">=0.1.0 <0.2.0"
vars:
  id:
    type: string
    description: Extension id
    default: appwrite
  app_name:
    type: string
    description: Application package name
    default: my_app
  endpoint:
    type: string
    description: Appwrite API endpoint
    default: https://cloud.appwrite.io/v1
  project_id:
    type: string
    description: Appwrite project id
    default: kiln_demo
  database_id:
    type: string
    description: Appwrite database id
    default: kiln
  bucket_id:
    type: string
    description: Appwrite storage bucket id
    default: kiln_files
