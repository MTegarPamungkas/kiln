id: firebase
name: Firebase
version: 0.2.0
description: Firebase Auth, Firestore, and Cloud Storage behind Kiln contracts.
category: auth
tier: official
exclusive: true
provides:
  - auth
  - social_auth
  - remote_database
  - file_storage
dependencies:
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  firebase_storage: ^14.0.1
prompts:
  - name: options_source
    type: enum
    label: Sumber FirebaseOptions
    description: generated memakai lib/firebase_options.dart dari FlutterFire CLI, explicit memakai FirebaseOptions yang diberikan ke FirebaseModule.
    default: generated
    options:
      - generated
      - explicit
  - name: firebase_options_path
    type: string
    label: Lokasi firebase_options.dart
    default: lib/firebase_options.dart
  - name: emulator_host
    type: string
    label: Host Firebase Emulator Suite
    default: localhost
  - name: use_emulator_in_development
    type: bool
    label: Pakai emulator pada flavor development
    default: true
platforms:
  - android
  - ios
  - macos
  - web
  - windows
manual_steps:
  - id: firebase_flutterfire_configure
    description: Jalankan flutterfire configure agar lib/firebase_options.dart dan konfigurasi native Firebase tersedia sebelum aplikasi dijalankan.
  - id: firebase_social_sign_in
    description: Aktifkan provider Google dan Apple di Firebase Console, lalu tambahkan SHA fingerprint Android dan URL scheme terbalik iOS sesuai docs/firebase-setup.md.
  - id: firebase_emulator_start
    description: Jalankan firebase emulators:start di root proyek bila flavor development memakai emulator.
compatibility:
  kiln: ">=0.1.0 <0.2.0"
  dart: ">=3.9.0"
  flutter: ">=3.35.0"
