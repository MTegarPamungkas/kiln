name: image_picker
description: Image picking files for Kiln.
version: 0.1.0
environment:
  mason: ">=0.1.0 <0.2.0"
vars:
  id:
    type: string
    description: Extension id
    default: image_picker
  app_name:
    type: string
    description: Application package name
    default: my_app
  max_bytes:
    type: number
    description: Maximum image size in bytes
    default: 5242880
  allowed_types:
    type: list
    description: Allowed image MIME types
    default:
      - image/jpeg
      - image/png
      - image/webp
      - image/heic
      - image/gif
