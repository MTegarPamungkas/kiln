name: env
description: Environment files for Kiln.
version: 0.1.0
environment:
  mason: ">=0.1.0 <0.2.0"
vars:
  id:
    type: string
    description: Extension id
    default: env
  app_name:
    type: string
    description: Application package name
    default: my_app
  keys:
    type: list
    description: Environment keys
    default:
      - api_base_url
      - api_key
      - feature_flags
      - enable_debug_tools
