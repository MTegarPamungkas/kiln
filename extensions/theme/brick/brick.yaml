name: theme
description: Brand theme, design tokens, and light or dark mode for Kiln.
version: 0.1.0
environment:
  mason: ">=0.1.0 <0.2.0"
vars:
  id:
    type: string
    description: Extension id
    default: theme
  app_name:
    type: string
    description: Application package name
    default: my_app
  seed_color:
    type: string
    description: Seed color for the Material color scheme
    default: "#0F766E"
  font_family:
    type: string
    description: Font family for the text theme
    default: ""
  corner_radius:
    type: number
    description: Base corner radius in logical pixels
    default: 14
  density:
    type: string
    description: Layout density (comfortable or compact)
    default: comfortable
