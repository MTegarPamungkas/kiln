name: remote_config
description: Remote configuration files for Kiln.
version: 0.1.0
environment:
  mason: ">=0.1.0 <0.2.0"
vars:
  id:
    type: string
    description: Extension id
    default: remote_config
  app_name:
    type: string
    description: Application package name
    default: my_app
  endpoint:
    type: string
    description: Remote config JSON endpoint
    default: ""
