id: remote_config
name: Remote Config
version: 0.1.1
description: Feature flags and remote configuration fetched from any JSON HTTP endpoint, read through the Gate.
category: config
tier: official
# Complements build-time env values instead of replacing them.
exclusive: false
provides:
  - remote_config
optional_requires:
  - flavor
dependencies:
  http: ^1.6.0
prompts:
  - name: endpoint
    type: string
    label: Remote config JSON endpoint
    description: Absolute URL returning a JSON object of flag values. Leave empty to disable fetching.
    default: ""
    required: false
platforms:
  - android
  - ios
  - macos
  - web
  - windows
  - linux
android:
  permissions:
    - android.permission.INTERNET
compatibility:
  kiln: ">=0.1.0 <0.2.0"
  dart: ">=3.9.0"
