name: neon
description: Neon Data API and Object Storage files for Kiln.
version: 0.1.0
environment:
  mason: ">=0.1.0 <0.2.0"
vars:
  id:
    type: string
    description: Extension id
    default: neon
  app_name:
    type: string
    description: Application package name
    default: my_app
  data_api_url:
    type: string
    description: Neon Data API base URL
    default: https://example.aws.neon.tech/sql/rest
  api_key:
    type: string
    description: Neon Data API bearer token
    default: ""
  auth_url:
    type: string
    description: Neon Auth base URL (for anonymous tokens)
    default: ""
  schema:
    type: string
    description: Postgres schema
    default: public
  s3_endpoint:
    type: string
    description: Neon Object Storage endpoint
    default: https://example.storage.c-us-east-2.aws.neon.tech
  s3_bucket:
    type: string
    description: Object Storage bucket
    default: files
  s3_region:
    type: string
    description: Object Storage region
    default: us-east-2
  s3_access_key_id:
    type: string
    description: Object Storage access key id
    default: your-token-id
  s3_secret_access_key:
    type: string
    description: Object Storage secret access key
    default: your-s3-secret
