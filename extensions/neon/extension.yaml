id: neon
name: Neon
version: 0.1.1
description: Neon Auth (Better Auth), Lakebase Postgres database (Data API / PostgREST), and Object Storage (S3-compatible) for Kiln, read through the Gate.
category: database
tier: official
exclusive: false
provides:
  - auth
  - remote_database
  - file_storage
dependencies:
  http: ^1.6.0
prompts:
  - name: data_api_url
    type: url
    label: Neon Data API URL
    description: "PostgREST Data API base URL, for example https://<compute>.apirest.c-2.<region>.aws.neon.tech/<db>/rest/v1. Copy the exact host from the console."
    required: true
  - name: api_key
    type: secret
    label: Neon Data API bearer token
    description: Client-safe bearer token (a Neon Auth JWT). Optional when auth_url is set and anonymous access is enough. Never use a service-role key.
    required: false
    secret: true
  - name: auth_url
    type: string
    label: Neon Auth base URL
    description: "Base URL of Neon Auth (Better Auth), for example https://<compute>.neonauth.c-2.<region>.aws.neon.tech/<db>/auth. With an empty api_key, the connector fetches anonymous JWTs from {auth_url}/token/anonymous."
    required: false
  - name: schema
    type: string
    label: Postgres schema
    description: Schema exposed through the Data API.
    default: public
  - name: storage_signing_url
    type: url
    label: Storage signing backend URL
    description: "Your backend endpoint that verifies the signed-in user's Neon Auth JWT and returns a short-lived presigned S3 URL. S3 credentials stay on that server, never in the app. HTTPS only (HTTP loopback is accepted in development)."
    required: true
  - name: s3_bucket
    type: string
    label: Object Storage bucket
    description: Bucket name used for every file. The signing backend must enforce per-user access to this bucket.
    default: files
    secret: true
platforms:
  - android
  - ios
  - macos
  - web
  - windows
  - linux
android:
  permissions:
    - android.permission.INTERNET
manual_steps:
  - id: enable_data_api
    description: Enable the Data API (PostgREST) on the Neon project and confirm its base URL; the endpoint must be reachable from the app.
  - id: scope_the_token
    description: "Protect rows with Postgres row-level security and a per-user Neon Auth JWT. A single bearer token shared by every client exposes the whole schema, so do not ship a privileged key."
  - id: enable_object_storage
    description: Enable Object Storage on the project (supported regions only) and create the bucket named in the s3_bucket prompt. Keep the S3 access key id and secret on your signing backend; do not put them in the app.
  - id: deploy_storage_signing
    description: "Deploy a signing endpoint that validates the caller's Neon Auth JWT and per-user object ownership, then returns {url, headers?} for the requested upload, download, or delete. Accept POST JSON {operation, bucket, key, contentType?, metadata?, expiresIn?} and issue URLs valid for at most 900 seconds. The SDK calls storage_signing_url with Authorization: Bearer <user JWT> and never with an anonymous or shared S3 token."
compatibility:
  kiln: ">=0.1.0 <0.2.0"
  dart: ">=3.9.0"
