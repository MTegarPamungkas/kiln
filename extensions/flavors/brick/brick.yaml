name: flavors
description: Flavor files for Kiln.
version: 0.1.0
environment:
  mason: ">=0.1.0 <0.2.0"
vars:
  id:
    type: string
    description: Extension id
    default: flavors
  app_name:
    type: string
    description: Application package name
    default: my_app
  flavors:
    type: list
    description: Application flavors
    default:
      - development
      - staging
      - production
