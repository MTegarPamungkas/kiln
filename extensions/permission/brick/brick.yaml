name: permission
description: Permission files for Kiln.
version: 0.1.0
environment:
  mason: ">=0.1.0 <0.2.0"
vars:
  id:
    type: string
    description: Extension id
    default: permission
  app_name:
    type: string
    description: Application package name
    default: my_app
  kinds:
    type: list
    description: Enabled permission kinds
    default:
      - camera
      - microphone
      - photos
      - notifications
      - location
      - contacts
      - storage
