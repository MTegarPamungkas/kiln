name: kiln_workspace
description: Monorepo workspace for the Kiln Flutter application framework.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.13.0

workspace:
  - extensions/analytics
  - extensions/appwrite
  - extensions/biometric
  - extensions/bloc
  - extensions/calendar
  - extensions/codegen
  - extensions/connectivity
  - extensions/crash_report
  - extensions/deep_link
  - extensions/dio
  - extensions/env
  - extensions/firebase
  - extensions/flavors
  - extensions/geolocation
  - extensions/go_router
  - extensions/http_cache
  - extensions/http_retry
  - extensions/image_picker
  - extensions/l10n
  - extensions/local_db
  - extensions/logger
  - extensions/notifications
  - extensions/permission
  - extensions/rest_auth
  - extensions/riverpod
  - extensions/secure_storage
  - extensions/share
  - extensions/social_login
  - extensions/storage
  - extensions/supabase
  - extensions/theme
  - packages/kiln_core
  - packages/kiln_extension_sdk
  - packages/kiln_cli
  - packages/kiln_store
  - packages/kiln_testing
  - packages/kiln_lints

dev_dependencies:
  crypto: ^3.0.8
  http: ^1.6.0
  kiln_extension_sdk: ^0.1.0
  kiln_store: ^0.1.0
  lints: ^6.1.0
  mason: ^0.1.3
  path: ^1.9.1
  pub_semver: ^2.2.1
  test: ^1.31.1
  yaml: ^3.1.4
