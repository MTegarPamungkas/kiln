name: Drift

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Check extension dependency drift
        run: dart run tool/check_drift.dart --check
