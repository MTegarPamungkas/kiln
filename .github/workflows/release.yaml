name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart analyze
      - run: dart run tool/lint_extensions.dart
      - run: dart run tool/bundle.dart --check
      - run: dart run tool/gen_catalog_docs.dart --check
      - run: dart run tool/verify_extensions.dart --check
      - run: dart run tool/registry.dart --check
      - run: dart run tool/check_docs.dart --check
      - run: dart run tool/check_versions.dart --check
      - name: Package registry and CLI sources
        run: |
          mkdir -p dist
          tar -czf "dist/kiln-registry-${GITHUB_REF_NAME}.tgz" registry
          git archive --format=tar.gz --output="dist/kiln-monorepo-sources-${GITHUB_REF_NAME}.tgz" HEAD
      - name: Verify source archive and build CLI
        run: |
          source_dir="$(mktemp -d)"
          cli_dir="$(mktemp -d)"
          tar -xzf "dist/kiln-monorepo-sources-${GITHUB_REF_NAME}.tgz" -C "$source_dir"
          release_commit="$(git rev-parse HEAD)"
          (
            cd "$source_dir"
            flutter pub get
            dart compile exe -DKILN_CORE_GIT_REF="$release_commit" \
              packages/kiln_cli/bin/kiln.dart -o "$cli_dir/kiln"
          )
          (
            cd "$cli_dir"
            ./kiln version
            ./kiln create release_smoke --platforms web --yes
            cd release_smoke
            flutter analyze
          )
          cp "$cli_dir/kiln" dist/kiln-linux-x64
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tgz
            dist/kiln-linux-x64
