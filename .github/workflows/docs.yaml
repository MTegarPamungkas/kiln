name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - "registry/README.md"
  pull_request:
    paths:
      - "docs/**"
      - "README.md"
      - "registry/README.md"

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run tool/check_docs.dart --check
      - name: Build API docs
        working-directory: packages/kiln_core
        run: dart doc --output "$RUNNER_TEMP/kiln-api"
      - uses: actions/upload-artifact@v4
        with:
          name: kiln-api-docs
          path: ${{ runner.temp }}/kiln-api
          if-no-files-found: error
