name: Extensions

on:
  push:
    branches: [main]
    paths:
      - "extensions/**"
      - "packages/**"
  pull_request:
    paths:
      - "extensions/**"
      - "packages/**"

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        extension:
          - analytics
          - appwrite
          - biometric
          - bloc
          - connectivity
          - deep_link
          - dio
          - env
          - firebase
          - flavors
          - go_router
          - http_cache
          - http_retry
          - image_picker
          - l10n
          - local_db
          - logger
          - notifications
          - permission
          - rest_auth
          - riverpod
          - secure_storage
          - social_login
          - storage
          - supabase
          - theme
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Test ${{ matrix.extension }}
        working-directory: extensions/${{ matrix.extension }}
        run: dart test
