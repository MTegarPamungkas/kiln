name: kiln_testing
description: Fakes, contract suites, and test harness for Kiln applications and extensions.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.35.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_test:
    sdk: flutter
  kiln_core: ^0.1.0
  # Loose on purpose: flutter_test pins test_api, so a tight lower bound makes
  # kiln_testing unusable in projects that also run build_runner or freezed.
  test: ">=1.25.0 <2.0.0"

dev_dependencies:
  lints: ^6.1.0
