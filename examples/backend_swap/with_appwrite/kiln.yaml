# Kiln project configuration. May be edited; kiln does not overwrite it.
kiln: ">=0.1.0 <0.2.0"
core: ^0.1.0
project:
  name: with_appwrite
  org: com.example
  platforms:
    - android
    - ios
    - web

state: none
extensions: {appwrite: {endpoint: https://cloud.appwrite.io/v1, project_id: kiln_demo, database_id: kiln, bucket_id: kiln_files}, l10n: {locales: [id, en], fallback_locale: id}}
verify:
  after_add: [pub_get, analyze]
registry:
  offline: false
