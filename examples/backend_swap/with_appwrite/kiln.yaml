# Konfigurasi proyek Kiln. Boleh diedit; kiln tidak menimpanya.
kiln: ">=0.1.0 <0.2.0"
core: ^0.1.0
project:
  name: with_appwrite
  org: com.example
  platforms:
    - android
    - ios
    - web

state: none
extensions: {appwrite: {endpoint: https://cloud.appwrite.io/v1, project_id: kiln_demo, database_id: kiln, bucket_id: kiln_files}}
verify:
  after_add: [pub_get, analyze]
registry:
  offline: false
