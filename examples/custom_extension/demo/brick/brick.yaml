name: demo
description: Demo extension files rendered into the user project.
version: 0.1.0
environment:
  mason: ">=0.1.0 <0.2.0"
vars:
  id:
    type: string
    description: Extension id
    default: demo
  name:
    type: string
    description: Extension name
    default: Demo extension
  app_name:
    type: string
    description: Application name
    default: my_app
