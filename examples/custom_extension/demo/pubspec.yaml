name: demo_extension
description: Development package for the Demo extension Kiln extension.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.0

dev_dependencies:
  kiln_extension_sdk: ^0.1.0
  lints: ^6.1.0
  path: ^1.9.1
  test: ^1.31.1

# Resolve workspace packages from this checkout while developing the example.
dependency_overrides:
  kiln_core:
    path: ../../../packages/kiln_core
  kiln_extension_sdk:
    path: ../../../packages/kiln_extension_sdk
