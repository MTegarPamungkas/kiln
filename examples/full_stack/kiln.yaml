# Konfigurasi proyek Kiln. Boleh diedit; kiln tidak menimpanya.
kiln: ">=0.1.0 <0.2.0"
core: ^0.1.0
project:
  name: full_stack
  org: com.example
  platforms:
    - android
    - ios
    - web

state: none
extensions: {bloc: {}, dio: {base_url: https://api.example.com, connect_timeout: 15}, env: {keys: [api_base_url, api_key, feature_flags, enable_debug_tools]}, go_router: {}, http_retry: {max_attempts: 3, initial_delay_ms: 250, max_delay_ms: 8000, jitter: true}, l10n: {locales: [id, en], fallback_locale: id}, logger: {file_sink: true, http_logging: true}, rest_auth: {base_url: https://api.example.com, login_path: /auth/login, register_path: /auth/register, refresh_path: /auth/refresh, logout_path: /auth/logout, me_path: /auth/me}, secure_storage: {}, theme: {seed_color: "#0F766E", font_family: "", corner_radius: 14, density: comfortable}}
verify:
  after_add: [pub_get, analyze]
registry:
  offline: false
