# Kiln project configuration. May be edited; kiln does not overwrite it.
kiln: ">=0.1.0 <0.2.0"
core: ^0.1.0
project:
  name: minimal
  org: com.example
  platforms:
    - android
    - ios
    - web

state: none
extensions: {l10n: {locales: [id, en], fallback_locale: id}}
verify:
  after_add: [pub_get, analyze]
registry:
  offline: false
